# プッシュ・プルリクエストのたびに、テスト・Lint・フロントエンドのビルドを自動で確認する
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # uv.lock と pyproject.toml がずれていたら失敗させる（ロックファイルの更新忘れに気づける）
      - name: 依存ライブラリのインストール
        run: uv sync --locked

      - name: Lint（Ruff）
        run: uvx ruff@0.16.9 check .

      - name: フォーマットの確認（Ruff）
        run: uvx ruff@0.16.9 format --check .

      - name: テスト（pytest・SQLite）
        run: uv run pytest -v

  # 本番と同じPostgreSQLで、マイグレーションとテストを確認する
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 依存ライブラリのインストール
        run: uv sync --locked

      - name: マイグレーションを最新まで実行
        run: uv run alembic upgrade head

      # models.py を変えたのにマイグレーションを作り忘れていたら失敗する
      - name: モデルの定義とマイグレーションにずれがないか確認
        run: uv run alembic check

      - name: マイグレーションを最初まで戻せるか確認
        run: uv run alembic downgrade base

      - name: テスト（pytest・PostgreSQL）
        run: uv run pytest -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存ライブラリのインストール
        run: npm ci

      - name: ビルド（型チェックを含む）
        run: npm run build
