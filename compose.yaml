services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: "1"
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - ledger-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  ledger-data: