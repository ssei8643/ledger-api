services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: "1"
      FRONTEND_ORIGIN: http://localhost:8080
      # AIによる科目の推測を使う場合だけ、起動する前にPowerShellで $env:ANTHROPIC_API_KEY を設定しておく
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ledger-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  ledger-data: